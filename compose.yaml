services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: reservehub
      POSTGRES_PASSWORD: reservehub_dev
      POSTGRES_DB: reservehub
    ports:
      - "5432:5432"
    volumes:
      - reservehub_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservehub -d reservehub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  reservehub_data:
