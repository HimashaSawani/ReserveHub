services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reservehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reservehub_dev}
      POSTGRES_DB: ${POSTGRES_DB:-reservehub}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - reservehub_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reservehub} -d ${POSTGRES_DB:-reservehub}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  reservehub_data:
